version: '3.8'

services:
  erp-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-web-app
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - erp-network

networks:
  erp-network:
    driver: bridge